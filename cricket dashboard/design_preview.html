<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SupeRR Selector S2 — Interactive Design Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="./frontend/static/css/style.css">
</head>
<body class="min-h-screen flex flex-col bg-[#070B14] text-[#F1F5F9] font-sans">
  <header class="sticky top-0 z-50 bg-[#0B132B]/90 backdrop-blur-md border-b border-slate-800 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 flex items-center justify-center font-bold text-xl">RR</div>
      <div>
        <h1 class="text-base font-bold text-white leading-tight">Supe<span class="text-emerald-400">RR</span> Selector <span class="text-xs bg-amber-500/20 text-amber-400 px-1.5 py-0.5 rounded border border-amber-500/30">S2</span></h1>
        <p class="text-xs text-slate-400">Clutch Analytics Platform</p>
      </div>
    </div>
    <div class="flex items-center space-x-2 bg-slate-800/80 border border-slate-700 px-3 py-1.5 rounded-lg text-xs">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span>IPL &amp; T20I (2022-2024)</span>
    </div>
  </header>
  <main class="flex-1 max-w-6xl w-full mx-auto p-6 space-y-6">
    <div class="glass-card rounded-2xl p-8 border border-white/10 space-y-3">
      <h2 class="text-3xl font-extrabold text-white">Identify the Most <span class="text-emerald-400">Reliable Players</span> Under Pressure</h2>
      <p class="text-slate-300 text-sm max-w-2xl">Complete cricket analytics platform powered by Python Flask backend and responsive frontend dashboard.</p>
    </div>
  </main>
</body>
</html>
